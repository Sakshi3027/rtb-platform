services:
  redis:
    image: redis:7.4-alpine
    container_name: rtb-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aerospike:
    image: aerospike:ce-8.1.2.4
    container_name: rtb-aerospike
    ports:
      - "3000:3000"

  kafka:
    image: apache/kafka:4.1.2
    container_name: rtb-kafka
    ports:
      - "9092:9092"
